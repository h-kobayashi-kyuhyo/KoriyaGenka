<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
  <style>
    body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f3f4f6; }
    .tab-active { border-bottom: 4px solid #3b82f6; color: #3b82f6; font-weight: bold; }
    .tab-inactive { color: #6b7280; font-weight: normal; }
  </style>
</head>
<body class="min-h-screen">

  <div id="login-view" class="flex justify-center items-center h-screen p-4">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-sm">
      <h1 class="text-2xl font-bold text-center text-gray-800 mb-6">業務システムログイン</h1>
      <!-- ★修正：ログインIDをプルダウンに変更 -->
      <div class="mb-4">
        <label class="block text-sm font-bold mb-2">ログインID</label>
        <select id="login-id" class="w-full p-3 border rounded bg-gray-50 font-bold">
          <option value="">読込中...</option>
        </select>
      </div>
      <div class="mb-6"><label class="block text-sm font-bold mb-2">パスワード</label><input type="password" id="login-pass" class="w-full p-3 border rounded bg-gray-50"></div>
      <p id="login-error" class="text-red-500 text-sm mb-4 hidden text-center"></p>
      <button onclick="attemptLogin()" id="login-btn" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-md">ログイン</button>
    </div>
  </div>

  <div id="app-view" class="hidden flex flex-col h-screen">
    <header class="bg-white shadow-sm p-4 flex justify-between items-center">
      <h1 class="text-lg font-bold">店舗システム</h1>
      <div class="text-sm"><span id="staff-name-display" class="font-bold text-blue-600"></span> さん <button onclick="logout()" class="ml-4 text-xs underline text-gray-400">ログアウト</button></div>
    </header>

    <div class="flex bg-white shadow-sm px-2">
      <button onclick="switchTab('daily')" id="tab-daily" class="flex-1 py-3 text-center tab-active transition">廃棄・試食登録</button>
      <button onclick="switchTab('recipe')" id="tab-recipe" class="flex-1 py-3 text-center tab-inactive transition">マスター管理</button>
    </div>

    <main class="flex-1 p-4 overflow-y-auto">
      
      <!-- 日次業務（廃棄・試食）フォーム -->
      <div id="content-daily">
        <div class="bg-white p-6 rounded-lg shadow-sm border mb-4">
          <h2 class="text-xl font-bold text-gray-700 mb-6 border-b pb-2">日々の記録（廃棄・試食）</h2>
          
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div><label class="block text-sm font-bold mb-1 text-gray-600">日付</label><input type="date" id="daily-date" class="w-full p-3 border rounded bg-gray-50 font-bold"></div>
            <div><label class="block text-sm font-bold mb-1 text-gray-600">登録者</label><input type="text" id="daily-staff" class="w-full p-3 border rounded bg-gray-200 font-bold text-gray-500" readonly></div>
            
            <div>
              <label class="block text-sm font-bold mb-1 text-gray-600">区分</label>
              <select id="daily-category" onchange="updateDailyDropdowns()" class="w-full p-3 border rounded bg-white font-bold">
                <option value="廃棄">🗑️ 廃棄</option>
                <option value="試食">🥄 試食</option>
              </select>
            </div>
            
            <div>
              <label class="block text-sm font-bold mb-1 text-gray-600">マスター種別</label>
              <select id="daily-item-type" onchange="updateDailyDropdowns()" class="w-full p-3 border rounded bg-white">
                <option value="product">🍧 かき氷製品</option>
                <option value="source">🍯 ソース</option>
                <option value="material">🍓 原料</option>
              </select>
            </div>
            
            <div class="md:col-span-2">
              <label class="block text-sm font-bold mb-1 text-gray-600">対象アイテム</label>
              <select id="daily-item-cd" class="w-full p-3 border rounded bg-white text-lg font-bold text-blue-700"></select>
            </div>
            
            <div><label class="block text-sm font-bold mb-1 text-gray-600">数量 (杯, g, ml など)</label><input type="number" id="daily-qty" class="w-full p-3 border rounded bg-gray-50"></div>
            <div><label class="block text-sm font-bold mb-1 text-gray-600">理由 (任意)</label><input type="text" id="daily-reason" class="w-full p-3 border rounded bg-gray-50" placeholder="例: オペレーションミス、品質チェックなど"></div>
          </div>
          
          <button onclick="submitDailyRecord()" id="daily-save-btn" class="w-full mt-6 py-4 bg-gray-800 hover:bg-gray-900 text-white font-bold rounded-xl shadow-md transition text-lg">記録を登録する</button>
        </div>
      </div>

      <!-- マスター管理フォーム -->
      <div id="content-recipe" class="hidden">
        <div class="flex gap-2 mb-4">
          <select id="master-type" onchange="changeMasterView()" class="p-2 border rounded shadow-sm flex-1 font-bold text-gray-700">
            <option value="product">🍧 かき氷製品</option>
            <option value="source">🍯 ソース</option>
            <option value="material">🍓 原料</option>
          </select>
          <select id="action-type" onchange="changeMasterView()" class="p-2 border rounded shadow-sm flex-1 bg-yellow-50 font-bold text-yellow-700">
            <option value="new">✨ 新規登録</option>
            <option value="edit">✏️ 既存編集</option>
          </select>
        </div>

        <!-- かき氷フォーム -->
        <div id="view-product">
          <div class="bg-white p-4 rounded-lg shadow-sm border mb-4">
            <div class="flex justify-between items-center mb-3">
               <h3 class="font-bold text-blue-600">① 基本情報</h3>
            </div>
            <div id="product-edit-select" class="mb-4 hidden p-3 bg-yellow-100 rounded border border-yellow-300">
               <label class="block text-xs text-yellow-800 mb-1 font-bold">編集する製品を選択</label>
               <select id="edit-product-cd" class="w-full p-2 border rounded bg-white" onchange="loadProductDetail()"></select>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div><label class="block text-xs mb-1">製品CD</label><input type="text" id="recipe-cd" class="w-full p-2 border rounded font-bold text-blue-700 bg-gray-100" readonly></div>
              <div><label class="block text-xs mb-1 font-bold text-purple-600">表示区分 (空白:有効, 99:非表示)</label><input type="text" id="recipe-displayFlag" class="w-full p-2 border-2 border-purple-200 rounded bg-purple-50"></div>
              <div><label class="block text-xs mb-1">製品名</label><input type="text" id="recipe-name" class="w-full p-2 border rounded bg-gray-50"></div>
              <div><label class="block text-xs mb-1">販売価格(税込)</label><input type="number" id="recipe-price" class="w-full p-2 border rounded bg-gray-50"></div>
            </div>
          </div>
          <div class="bg-white p-4 rounded-lg shadow-sm border mb-4">
            <div class="flex justify-between items-center mb-3">
              <h3 class="font-bold text-blue-600">② レシピ構成</h3>
              <button onclick="addIngredientRow('ingredient-list')" class="bg-green-500 text-white text-xs py-1 px-3 rounded shadow">＋ 追加</button>
            </div>
            <div id="ingredient-list" class="space-y-2"></div>
          </div>
          <button onclick="submitRecipe()" id="recipe-save-btn" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-md transition">かき氷を新規登録する</button>
        </div>

        <!-- ソースフォーム -->
        <div id="view-source" class="hidden">
          <div class="bg-white p-4 rounded-lg shadow-sm border mb-4">
            <div class="flex justify-between items-center mb-3">
               <h3 class="font-bold text-yellow-600">① ソース基本情報</h3>
            </div>
            <div id="source-edit-select" class="mb-4 hidden p-3 bg-yellow-100 rounded border border-yellow-300">
               <label class="block text-xs text-yellow-800 mb-1 font-bold">編集するソースを選択</label>
               <select id="edit-source-cd" class="w-full p-2 border rounded bg-white" onchange="loadSourceDetail()"></select>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
              <div><label class="block text-xs mb-1">ソースCD</label><input type="text" id="source-cd-display" class="w-full p-2 border rounded font-bold text-yellow-700 bg-gray-100" readonly></div>
              <div><label class="block text-xs mb-1">ソース名</label><input type="text" id="source-name" class="w-full p-2 border rounded bg-gray-50"></div>
              <div><label class="block text-xs mb-1">出来上がり量 (g / ml)</label><input type="number" id="source-yield" class="w-full p-2 border rounded bg-gray-50" placeholder="例: 1000"></div>
              <div class="md:col-span-3"><label class="block text-xs mb-1 font-bold text-purple-600">表示区分 (空白:有効, 99:非表示)</label><input type="text" id="source-displayFlag" class="w-full p-2 border-2 border-purple-200 rounded bg-purple-50"></div>
            </div>
          </div>
          <div class="bg-white p-4 rounded-lg shadow-sm border mb-4">
            <div class="flex justify-between items-center mb-3">
              <h3 class="font-bold text-yellow-600">② ソースレシピ構成</h3>
              <button onclick="addIngredientRow('source-ingredient-list')" class="bg-green-500 text-white text-xs py-1 px-3 rounded shadow">＋ 追加</button>
            </div>
            <div id="source-ingredient-list" class="space-y-2"></div>
          </div>
          <button onclick="submitSource()" id="source-save-btn" class="w-full py-3 bg-yellow-500 hover:bg-yellow-600 text-white font-bold rounded-xl shadow-md transition">ソースを新規登録する</button>
        </div>

        <!-- 原料フォーム -->
        <div id="view-material" class="hidden">
          <div class="bg-white p-4 rounded-lg shadow-sm border mb-4">
            <div class="flex justify-between items-center mb-3">
               <h3 class="font-bold text-red-500">原料情報</h3>
            </div>
            <div id="mat-edit-select" class="mb-4 hidden p-3 bg-yellow-100 rounded border border-yellow-300">
               <label class="block text-xs text-yellow-800 mb-1 font-bold">編集する原料を選択</label>
               <select id="edit-mat-cd" class="w-full p-2 border rounded bg-white" onchange="loadMaterialDetail()"></select>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
              <div><label class="block text-xs mb-1">原料CD</label><input type="text" id="mat-cd-display" class="w-full p-2 border rounded font-bold text-red-500 bg-gray-100" readonly></div>
              <div class="md:col-span-2"><label class="block text-xs mb-1">原料名</label><input type="text" id="mat-name" class="w-full p-2 border rounded bg-gray-50"></div>
              <div><label class="block text-xs mb-1">規格</label><input type="text" id="mat-kikaku" class="w-full p-2 border rounded bg-gray-50"></div>
              <div><label class="block text-xs mb-1">単位 (g, ml など)</label><input type="text" id="mat-unit" class="w-full p-2 border rounded bg-gray-50"></div>
              <div><label class="block text-xs mb-1">金額(税抜き)</label><input type="number" id="mat-priceEx" class="w-full p-2 border rounded bg-gray-50"></div>
              <div><label class="block text-xs mb-1">納入業者</label><input type="text" id="mat-supplier" class="w-full p-2 border rounded bg-gray-50"></div>
              <div class="md:col-span-2"><label class="block text-xs mb-1 font-bold text-purple-600">表示区分 (空白:有効, 99:非表示)</label><input type="text" id="mat-displayFlag" class="w-full p-2 border-2 border-purple-200 rounded bg-purple-50"></div>
              <div class="md:col-span-3"><label class="block text-xs mb-1">備考</label><input type="text" id="mat-memo" class="w-full p-2 border rounded bg-gray-50"></div>
            </div>
          </div>
          <button onclick="submitMaterial()" id="mat-save-btn" class="w-full py-3 bg-red-500 hover:bg-red-600 text-white font-bold rounded-xl shadow-md transition">原料を新規登録する</button>
        </div>

      </div>
    </main>
  </div>

  <script>
    let currentStaffName = '';
    let masterDataList = []; 
    let productDataList = []; 
    let currentMatCd = '';
    let currentSourceCd = '';
    let currentProductCd = '';

    // ★追加：画面読み込み時にログインIDのリストを取得してセット
    document.addEventListener("DOMContentLoaded", function() {
      google.script.run.withSuccessHandler(function(idList) {
        let html = '<option value="">選択してください</option>';
        idList.forEach(id => {
          html += `<option value="${id}">${id}</option>`;
        });
        document.getElementById('login-id').innerHTML = html;
      }).getUserList();
    });

    function setTodayDate() {
      const today = new Date();
      const yyyy = today.getFullYear();
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const dd = String(today.getDate()).padStart(2, '0');
      document.getElementById('daily-date').value = `${yyyy}-${mm}-${dd}`;
    }

    function loadMasterData() {
      google.script.run.withSuccessHandler(function(list) {
        masterDataList = list;
        addIngredientRow('ingredient-list');
        addIngredientRow('source-ingredient-list');
        updateEditDropdowns();
        updateDailyDropdowns(); 
      }).getIngredientMaster();
      
      fetchNextCd();
      fetchNextMaterialCd();
      fetchNextSourceCd();
      loadProductList(); 
    }

    function loadProductList() {
      google.script.run.withSuccessHandler(function(list) {
        productDataList = list;
        let html = '<option value="">選択してください</option>';
        list.forEach(item => {
          const mark = item.isHidden ? ' ⚠️(非表示)' : '';
          html += `<option value="${item.cd}">${item.name}${mark}</option>`;
        });
        document.getElementById('edit-product-cd').innerHTML = html;
        updateDailyDropdowns(); 
      }).getProductList();
    }

    // ★修正：試食を選んだら強制的に「かき氷製品」に固定するバリデーションを追加
    function updateDailyDropdowns() {
      const categoryObj = document.getElementById('daily-category');
      const itemTypeObj = document.getElementById('daily-item-type');
      const selectObj = document.getElementById('daily-item-cd');
      
      // 区分が「試食」ならマスター種別を「product」に固定し、グレーアウト(disabled)にする
      if (categoryObj.value === '試食') {
        itemTypeObj.value = 'product';
        itemTypeObj.disabled = true;
        itemTypeObj.classList.add('bg-gray-200', 'text-gray-500'); // ロックされている見た目
      } else {
        itemTypeObj.disabled = false;
        itemTypeObj.classList.remove('bg-gray-200', 'text-gray-500');
      }
      
      const itemTypeVal = itemTypeObj.value;
      let html = '<option value="">選択してください</option>';
      
      if (itemTypeVal === 'product') {
        productDataList.forEach(item => {
          if (!item.isHidden) html += `<option value="${item.cd}">${item.name}</option>`;
        });
      } else {
        const typeLabel = itemTypeVal === 'source' ? 'ソース' : '原料';
        masterDataList.forEach(item => {
          if (!item.isHidden && item.type === typeLabel) {
            html += `<option value="${item.cd}">${item.name}</option>`;
          }
        });
      }
      selectObj.innerHTML = html;
    }

    function submitDailyRecord() {
      const date = document.getElementById('daily-date').value;
      const staffName = document.getElementById('daily-staff').value;
      const category = document.getElementById('daily-category').value;
      const itemTypeVal = document.getElementById('daily-item-type').value;
      const itemCd = document.getElementById('daily-item-cd').value;
      const quantity = document.getElementById('daily-qty').value;
      const reason = document.getElementById('daily-reason').value;

      if (!date || !itemCd || !quantity) {
        alert("日付、対象アイテム、数量は必須です！");
        return;
      }

      const itemSelect = document.getElementById('daily-item-cd');
      const itemName = itemSelect.options[itemSelect.selectedIndex].text;
      
      let itemTypeLabel = 'かき氷製品';
      if(itemTypeVal === 'source') itemTypeLabel = 'ソース';
      if(itemTypeVal === 'material') itemTypeLabel = '原料';

      const payload = {
        date: date,
        staffName: staffName,
        category: category,
        itemType: itemTypeLabel,
        itemCd: itemCd,
        itemName: itemName,
        quantity: Number(quantity),
        reason: reason
      };

      const btn = document.getElementById('daily-save-btn');
      btn.disabled = true;
      btn.textContent = '保存中...';

      google.script.run.withSuccessHandler(function(res) {
        btn.disabled = false;
        btn.textContent = '記録を登録する';
        alert(`${category}の記録を保存しました！`);
        
        document.getElementById('daily-qty').value = '';
        document.getElementById('daily-reason').value = '';
      }).saveDailyRecord(payload);
    }

    function updateEditDropdowns() {
      let matHtml = '<option value="">選択してください</option>';
      let srcHtml = '<option value="">選択してください</option>';
      masterDataList.forEach(item => {
        const mark = item.isHidden ? ' ⚠️(非表示)' : '';
        if (item.type === '原料') matHtml += `<option value="${item.cd}">${item.name}${mark}</option>`;
        if (item.type === 'ソース') srcHtml += `<option value="${item.cd}">${item.name}${mark}</option>`;
      });
      document.getElementById('edit-mat-cd').innerHTML = matHtml;
      document.getElementById('edit-source-cd').innerHTML = srcHtml;
      
      document.querySelectorAll('.ingredient-cd').forEach(sel => {
        const rowType = sel.closest('.ingredient-row').querySelector('select').value;
        const currentVal = sel.value;
        sel.innerHTML = buildOptionsHTML(rowType);
        sel.value = currentVal; 
      });
    }

    function buildOptionsHTML(filterType) {
      let html = '<option value="">選択してください</option>';
      masterDataList.forEach(item => {
        if (!item.isHidden) {
          if (filterType === 'all' || item.type === filterType) {
            html += `<option value="${item.cd}">[${item.type}] ${item.name}</option>`;
          }
        }
      });
      return html;
    }

    function changeMasterView() {
      const master = document.getElementById('master-type').value;
      const action = document.getElementById('action-type').value;

      document.getElementById('view-product').classList.add('hidden');
      document.getElementById('view-source').classList.add('hidden');
      document.getElementById('view-material').classList.add('hidden');

      if (master === 'product') {
        document.getElementById('view-product').classList.remove('hidden');
        const editSelect = document.getElementById('product-edit-select');
        const saveBtn = document.getElementById('recipe-save-btn');
        if (action === 'edit') {
          editSelect.classList.remove('hidden'); saveBtn.textContent = 'かき氷を上書き保存する';
          document.getElementById('recipe-cd').value = ''; clearProductForm();
        } else {
          editSelect.classList.add('hidden'); saveBtn.textContent = 'かき氷を新規登録する';
          fetchNextCd(); clearProductForm(); document.getElementById('ingredient-list').innerHTML = ''; addIngredientRow('ingredient-list');
        }
      } else if (master === 'source') {
        document.getElementById('view-source').classList.remove('hidden');
        const editSelect = document.getElementById('source-edit-select');
        const saveBtn = document.getElementById('source-save-btn');
        if (action === 'edit') {
          editSelect.classList.remove('hidden'); saveBtn.textContent = 'ソースを上書き保存する';
          document.getElementById('source-cd-display').value = ''; clearSourceForm();
        } else {
          editSelect.classList.add('hidden'); saveBtn.textContent = 'ソースを新規登録する';
          fetchNextSourceCd(); clearSourceForm(); document.getElementById('source-ingredient-list').innerHTML = ''; addIngredientRow('source-ingredient-list');
        }
      } else if (master === 'material') {
        document.getElementById('view-material').classList.remove('hidden');
        const editSelect = document.getElementById('mat-edit-select');
        const saveBtn = document.getElementById('mat-save-btn');
        if (action === 'edit') {
          editSelect.classList.remove('hidden'); saveBtn.textContent = '原料を上書き保存する';
          document.getElementById('mat-cd-display').value = ''; clearMatForm();
        } else {
          editSelect.classList.add('hidden'); saveBtn.textContent = '原料を新規登録する';
          fetchNextMaterialCd(); clearMatForm();
        }
      }
    }

    function fetchNextCd() {
      document.getElementById('recipe-cd').value = '読込中...';
      google.script.run.withSuccessHandler(function(nextCd) {
        currentProductCd = nextCd; document.getElementById('recipe-cd').value = nextCd;
      }).getNextProductCd();
    }
    function clearProductForm() {
      document.getElementById('recipe-name').value = ''; document.getElementById('recipe-price').value = ''; document.getElementById('recipe-displayFlag').value = '';
    }
    function loadProductDetail() {
      const cd = document.getElementById('edit-product-cd').value;
      if (!cd) { clearProductForm(); document.getElementById('ingredient-list').innerHTML = ''; return; }
      currentProductCd = cd; document.getElementById('recipe-cd').value = cd;
      google.script.run.withSuccessHandler(function(detail) {
        if(detail) {
          document.getElementById('recipe-name').value = detail.name; document.getElementById('recipe-price').value = detail.price; document.getElementById('recipe-displayFlag').value = detail.displayFlag;
          const container = document.getElementById('ingredient-list'); container.innerHTML = '';
          if (detail.ingredients && detail.ingredients.length > 0) {
            detail.ingredients.forEach(ing => { addIngredientRow('ingredient-list', ing.cd, ing.amount); });
          } else { addIngredientRow('ingredient-list'); }
        }
      }).getProductDetail(cd);
    }
    function submitRecipe() {
      const action = document.getElementById('action-type').value;
      if (action === 'edit' && !currentProductCd) { alert("編集する製品を選択してください。"); return; }
      const name = document.getElementById('recipe-name').value;
      const price = document.getElementById('recipe-price').value;
      const displayFlag = document.getElementById('recipe-displayFlag').value;
      if(!name || !price) { alert("製品名と販売価格を入力してください。"); return; }
      const rows = document.querySelectorAll('#ingredient-list .ingredient-row');
      let ingredients = [];
      rows.forEach(row => {
        const ingCd = row.querySelector('.ingredient-cd').value; const amount = row.querySelector('.ingredient-amount').value;
        if(ingCd && amount) ingredients.push({ cd: ingCd, amount: Number(amount) });
      });
      if(ingredients.length === 0) { alert("原料を入力してください。"); return; }
      const payload = { mode: action, productCd: currentProductCd, productName: name, price: Number(price), displayFlag: displayFlag, ingredients: ingredients };
      const btn = document.getElementById('recipe-save-btn'); btn.disabled = true; btn.textContent = "保存中...";
      google.script.run.withSuccessHandler(function(res) {
        btn.disabled = false; btn.textContent = res.mode === 'new' ? 'かき氷を新規登録する' : 'かき氷を上書き保存する';
        alert(`保存が完了しました！`); clearProductForm(); document.getElementById('ingredient-list').innerHTML = ''; addIngredientRow('ingredient-list');
        if (res.mode === 'new') fetchNextCd(); loadProductList(); 
      }).saveRecipe(payload);
    }

    function fetchNextSourceCd() {
      document.getElementById('source-cd-display').value = '読込中...';
      google.script.run.withSuccessHandler(function(nextCd) {
        currentSourceCd = nextCd; document.getElementById('source-cd-display').value = nextCd;
      }).getNextSourceCd();
    }
    function clearSourceForm() {
      document.getElementById('source-name').value = ''; document.getElementById('source-yield').value = ''; document.getElementById('source-displayFlag').value = '';
    }
    function loadSourceDetail() {
      const cd = document.getElementById('edit-source-cd').value;
      if (!cd) { clearSourceForm(); document.getElementById('source-ingredient-list').innerHTML = ''; return; }
      currentSourceCd = cd; document.getElementById('source-cd-display').value = cd;
      google.script.run.withSuccessHandler(function(detail) {
        if(detail) {
          document.getElementById('source-name').value = detail.name; document.getElementById('source-yield').value = detail.yieldAmount; document.getElementById('source-displayFlag').value = detail.displayFlag;
          const container = document.getElementById('source-ingredient-list'); container.innerHTML = '';
          if (detail.ingredients && detail.ingredients.length > 0) {
            detail.ingredients.forEach(ing => { addIngredientRow('source-ingredient-list', ing.cd, ing.amount); });
          } else { addIngredientRow('source-ingredient-list'); }
        }
      }).getSourceDetail(cd);
    }
    function submitSource() {
      const action = document.getElementById('action-type').value;
      if (action === 'edit' && !currentSourceCd) { alert("編集するソースを選択してください。"); return; }
      const name = document.getElementById('source-name').value; const yieldAmt = document.getElementById('source-yield').value;
      if (!name || !yieldAmt) { alert("ソース名と出来上がり量を入力してください。"); return; }
      const rows = document.querySelectorAll('#source-ingredient-list .ingredient-row');
      let ingredients = [];
      rows.forEach(row => {
        const ingCd = row.querySelector('.ingredient-cd').value; const amount = row.querySelector('.ingredient-amount').value;
        if(ingCd && amount) ingredients.push({ cd: ingCd, amount: Number(amount) });
      });
      if(ingredients.length === 0) { alert("原料を1つ以上入力してください。"); return; }
      const payload = { mode: action, sourceCd: currentSourceCd, sourceName: name, yieldAmount: Number(yieldAmt), displayFlag: document.getElementById('source-displayFlag').value, ingredients: ingredients };
      const btn = document.getElementById('source-save-btn'); btn.disabled = true; btn.textContent = '保存中...';
      google.script.run.withSuccessHandler(function(res) {
        btn.disabled = false; btn.textContent = res.mode === 'new' ? 'ソースを新規登録する' : 'ソースを上書き保存する';
        alert("ソースの保存が完了しました！"); clearSourceForm(); document.getElementById('source-ingredient-list').innerHTML = ''; addIngredientRow('source-ingredient-list');
        if (res.mode === 'new') fetchNextSourceCd();
        google.script.run.withSuccessHandler(function(list) { masterDataList = list; updateEditDropdowns(); updateDailyDropdowns(); }).getIngredientMaster();
      }).saveSource(payload);
    }

    function addIngredientRow(containerId, initialCd = '', initialAmount = '') {
      const container = document.getElementById(containerId);
      const row = document.createElement('div');
      row.className = 'flex gap-2 items-center bg-gray-50 p-2 border rounded ingredient-row';
      row.innerHTML = `
        <div class="w-24"><select class="w-full p-2 border rounded bg-gray-200 text-xs" onchange="changeFilter(this)"><option value="all">すべて</option><option value="ソース">ソース</option><option value="原料">原料</option></select></div>
        <div class="flex-1"><select class="w-full p-2 border rounded bg-white ingredient-cd">${buildOptionsHTML('all')}</select></div>
        <div class="w-24"><input type="number" class="w-full p-2 border rounded ingredient-amount" placeholder="g/ml" value="${initialAmount}"></div>
        <button onclick="this.parentElement.remove()" class="text-red-500 font-bold px-2 rounded">×</button>`;
      if (initialCd) { setTimeout(() => { row.querySelector('.ingredient-cd').value = initialCd; }, 100); }
      container.appendChild(row);
    }

    function changeFilter(sel) {
      sel.closest('.ingredient-row').querySelector('.ingredient-cd').innerHTML = buildOptionsHTML(sel.value);
    }

    function loadMaterialDetail() {
      const cd = document.getElementById('edit-mat-cd').value;
      if (!cd) { clearMatForm(); return; }
      currentMatCd = cd; document.getElementById('mat-cd-display').value = cd;
      google.script.run.withSuccessHandler(function(detail) {
        if(detail) {
          document.getElementById('mat-name').value = detail.name; document.getElementById('mat-kikaku').value = detail.kikaku;
          document.getElementById('mat-unit').value = detail.unit; document.getElementById('mat-priceEx').value = detail.priceEx;
          document.getElementById('mat-supplier').value = detail.supplier; document.getElementById('mat-memo').value = detail.memo;
          document.getElementById('mat-displayFlag').value = detail.displayFlag;
        }
      }).getMaterialDetail(cd);
    }

    function clearMatForm() {
      document.getElementById('mat-name').value = ''; document.getElementById('mat-kikaku').value = '';
      document.getElementById('mat-unit').value = ''; document.getElementById('mat-priceEx').value = '';
      document.getElementById('mat-supplier').value = ''; document.getElementById('mat-memo').value = '';
      document.getElementById('mat-displayFlag').value = '';
    }

    function fetchNextMaterialCd() {
      document.getElementById('mat-cd-display').value = '読込中...';
      google.script.run.withSuccessHandler(function(nextCd) {
        currentMatCd = nextCd; document.getElementById('mat-cd-display').value = nextCd;
      }).getNextMaterialCd();
    }

    function submitMaterial() {
      const action = document.getElementById('action-type').value;
      if (action === 'edit' && !currentMatCd) { alert("編集する原料を選択してください。"); return; }
      const payload = {
        mode: action, cd: currentMatCd, name: document.getElementById('mat-name').value,
        kikaku: document.getElementById('mat-kikaku').value, unit: document.getElementById('mat-unit').value,
        priceEx: Number(document.getElementById('mat-priceEx').value), supplier: document.getElementById('mat-supplier').value,
        memo: document.getElementById('mat-memo').value, displayFlag: document.getElementById('mat-displayFlag').value
      };
      if (!payload.name) { alert("原料名を入力してください。"); return; }
      const btn = document.getElementById('mat-save-btn'); btn.disabled = true; btn.textContent = '保存中...';

      google.script.run.withSuccessHandler(function(res) {
        btn.disabled = false; btn.textContent = res.mode === 'new' ? '原料を新規登録する' : '上書き保存する';
        alert("保存が完了しました！"); clearMatForm();
        if (res.mode === 'new') fetchNextMaterialCd();
        google.script.run.withSuccessHandler(function(list) { masterDataList = list; updateEditDropdowns(); updateDailyDropdowns(); }).getIngredientMaster();
      }).saveMaterial(payload);
    }

    function attemptLogin() {
      const id = document.getElementById('login-id').value;
      const pass = document.getElementById('login-pass').value;
      const btn = document.getElementById('login-btn');
      const err = document.getElementById('login-error');
      
      // ★修正：IDが選択されていない場合のアラート
      if (!id) {
        alert("ログインIDを選択してください。");
        return;
      }
      if (!pass) return;
      
      btn.disabled = true; btn.textContent = '確認中...';
      google.script.run.withSuccessHandler(function(res) {
        btn.disabled = false; btn.textContent = 'ログイン';
        if (res.success) {
          document.getElementById('staff-name-display').textContent = res.staffName;
          document.getElementById('daily-staff').value = res.staffName; 
          
          document.getElementById('login-view').classList.add('hidden');
          document.getElementById('app-view').classList.remove('hidden');
          
          setTodayDate(); 
          loadMasterData();
          switchTab('daily');
        } else { err.textContent = res.message; err.classList.remove('hidden'); }
      }).checkLogin(id, pass);
    }
    
    function logout() { location.reload(); }
    
    function switchTab(tabName) {
      const tDaily = document.getElementById('tab-daily'), tRecipe = document.getElementById('tab-recipe');
      const cDaily = document.getElementById('content-daily'), cRecipe = document.getElementById('content-recipe');
      if (tabName === 'daily') {
        tDaily.className = 'flex-1 py-3 text-center tab-active transition text-blue-600 border-b-4 border-blue-600'; 
        tRecipe.className = 'flex-1 py-3 text-center tab-inactive transition text-gray-500 border-b-4 border-transparent hover:bg-gray-50';
        cDaily.classList.remove('hidden'); cRecipe.classList.add('hidden');
      } else {
        tDaily.className = 'flex-1 py-3 text-center tab-inactive transition text-gray-500 border-b-4 border-transparent hover:bg-gray-50'; 
        tRecipe.className = 'flex-1 py-3 text-center tab-active transition text-blue-600 border-b-4 border-blue-600';
        cDaily.classList.add('hidden'); cRecipe.classList.remove('hidden');
      }
    }
  </script>
</body>
</html>
